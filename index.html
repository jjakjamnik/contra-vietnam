<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <title>CONTRA VIETNAM</title>
  <meta name="description" content="Contra Vietnam — fanowski projekt retro, 2026.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="title-screen" aria-label="Contra Vietnam — ekran tytułowy">
    <section class="art" aria-label="Logo Contra Vietnam i bohaterowie">
      <img class="title-art" src="assets/title/contra-vietnam-title-bg.png" alt="Logo Contra Vietnam i dwaj żołnierze">
    </section>
    <section class="menu" aria-label="Menu główne">
      <h1>WYBÓR GRACZY</h1>
      <div class="choices" role="group" aria-label="Liczba graczy">
        <button class="choice selected" type="button" data-players="1" aria-pressed="true"><span class="cursor" aria-hidden="true">▶</span> 1 GRACZ</button>
        <button class="choice" type="button" data-players="2" aria-pressed="false"><span class="cursor" aria-hidden="true">▶</span> 2 GRACZY</button>
      </div>
    </section>
    <footer class="credits">
      <span>© 2026</span>
      <span>PROJEKT FANOWSKI</span>
      <span>BY J JAK JAMNIK</span>
    </footer>
    <p class="controls">↑ ↓ WYBÓR &nbsp; · &nbsp; ENTER / Z START</p>
  </main>
  <script type="module" src="js/game.js"></script>
</body>
</html>
