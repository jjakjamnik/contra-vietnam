
<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CONTRA</title>

    <meta name="description" content="Contra – klasyczna gra akcji w stylu NES">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main id="game-container">

        <!-- TYTUŁ GRY -->
        <header id="game-header">
            <h1>CONTRA</h1>
        </header>

        <!-- OBSZAR GRY -->
        <section id="game-screen">

            <canvas
                id="game-canvas"
                width="256"
                height="240"
                aria-label="Ekran gry Contra"
            >
                Twoja przeglądarka nie obsługuje elementu Canvas.
            </canvas>

        </section>

        <!-- INFORMACJA O STANIE GRY -->
        <div id="game-status">
            <span id="status-message">LOADING...</span>
        </div>

        <!-- STEROWANIE -->
        <section id="game-controls">

            <div class="control-info">
                <span>STEROWANIE</span>
            </div>

            <div class="control-keys">
                <span>← →</span>
                <span>RUCH</span>

                <span>↑</span>
                <span>CELOWANIE</span>

                <span>Z</span>
                <span>STRZAŁ</span>

                <span>X</span>
                <span>SKOK</span>

                <span>ENTER</span>
                <span>START</span>
            </div>

        </section>

    </main>

    <noscript>
        <p>Do uruchomienia gry wymagany jest JavaScript.</p>
    </noscript>

    <!-- SILNIK GRY -->
    <script type="module" src="js/game.js"></script>

</body>
</html>
